<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:insert="~{index :: head}"></head>
<body>

    <nav th:insert="~{index :: navbar}"></nav>

    <h1 class="text-center">Dettaglio richiesta</h1>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 d-flex flex-column">
                <div class="text-center">
                    <h2 th:text="${request.user.username}">Nome utente: </h2>
                </div>
            </div>
            <hr>
            <div class="col-12 col-md-8 d-flex flex-column align-items-center">
                <p th:text="${request.body}">Motivo della richiesta: </p>
            </div>
            <div class="d-flex">
                <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="post">
                    <button type="submit" class="btn btn-primary p-2">Accetta</button>
                </form>
                <a th:href="@{/admin/dashboard}">Torna indietro</a>
            </div>
        </div>
    </div>




    <div th:insert="~{index :: footer}"></div>

    <script th:replace="~{index :: bootstrapScript}"></script>
    
</body>
</html>
