<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">Aulab Cronichle</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/articles">I nostri articoli</a>
                </li>

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown">
                        Area personale
                    </a>

                    <ul class="dropdown-menu">

                        <li sec:authorize="isAnonymous">
                            <a class="dropdown-item" th:href="@{/register}">Registrati</a>
                        </li>

                        <li sec:authorize="isAnonymous">
                            <a class="dropdown-item" th:href="@{/login}">Accedi</a>
                        </li>

                        <li sec:authorize="isAuthenticated">
                            <a class="dropdown-item" th:href="@{/articles/create}">
                                Inserisci articolo
                            </a>
                        </li>

                        <li sec:authorize="hasRole('ADMIN')">
                            <div class="d-flex">
                                <a class="dropdown-item" th:href="@{/admin/dashboard}">
                                    Dashboard Admin
                                </a>

                                <div th:if="${careerRequests > 0}">
                                    <i class="fas fa-bell pt-2">
                                        <span class="badge bg-danger"
                                              th:text="${careerRequests}">
                                        </span>
                                    </i>
                                </div>
                            </div>
                        </li>

                        <li sec:authorize="hasRole('REVISOR')">
                            <div class="d-flex">
                                <a class="dropdown-item" th:href="@{/revisor/dashboard}">
                                    Dashboard del revisore
                                </a>

                                <div th:if="${articlesToBeRevised > 0}">
                                    <i class="fas fa-bell pt-2">
                                        <span class="badge bg-danger"
                                              th:text="${articlesToBeRevised}">
                                        </span>
                                    </i>
                                </div>
                            </div>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li sec:authorize="isAuthenticated">
                            <a class="dropdown-item" th:href="@{/logout}">Logout</a>
                        </li>

                    </ul>
                </li>

                <li sec:authorize="isAuthenticated" class="d-flex align-items-center">
                    Benvenuto <span class="px-2" sec:authentication="name"></span>
                </li>

            </ul>

            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-outline-success">Search</button>
            </form>

        </div>
    </div>
</nav>

<!-- FOOTER invariato -->
<footer th:fragment="footer" class="bg-dark text-white pt-4">
    <div class="container">
        <div class="row justify-content-between">

            <div class="col-md-4 mb-3">
                <a href="/">Home</a>
            </div>

            <div class="col-md-4 mb-3 text-end">
                <h5>Lavora con noi</h5>
                <a th:href="@{/operations/career/request}" class="btn btn-primary">
                    Richiedi
                </a>
            </div>

        </div>
    </div>

    <div class="bg-secondary text-center py-2">
        <p class="mb-0">All rights reserved.</p>
    </div>
</footer>

<script th:fragment="bootstrapScript"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
