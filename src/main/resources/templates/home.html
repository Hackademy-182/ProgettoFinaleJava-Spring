<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <head th:insert="~{index :: head}"></head>
</head>

<body>

    <div th:insert="~{index :: navbar}"></div>

    <h1 class="text-center">The Aulab Chronicle</h1>

<!-- Messaggio accesso non autorizzato -->

    <div th:if="${param.notAuthorized}">
        <div class="alert alert-danger">Accesso non autorizzato.</div>
    </div>

<!-- Messaggio avvenuta registrazione -->

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

<!-- Error message ruolo già ottenuto -->

    <div th:if="${errorMessage}" class="alert alert-success">
        <p th:text="${errorMessage}"></p>
    </div>

<!-- Cards ultimi 4 articoli -->

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-10 p-3">
                <h2 class="text-center">I nostri ultimi articoli</h2>
            </div>
        </div>
        <div class="row justify-content-center p-2">
            <div th:each="article:${articles}" class="col-12 col-md-3 p-2">
                <div class="card">
                    <img th:if="${article.image != null and article.image.path != null and !article.image.path.isEmpty()}" th:src="${article.image.path}" class="card-img-top" alt="Foto dell'articolo">
                    <img th:unless="${article.image != null and article.image.path != null and !article.image.path.isEmpty()}" th:src="@{/images/default.png}" alt="Immagine di default">
                    <div class="card-body">
                        <h5 th:text="${article.title}" class="card-title"></h5>
                        <p th:text="${article.subtitle}" class="card-text"></p>
                        <p th:text="${article.user.username}"></p>
                        <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary">Leggi articolo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:insert="~{index :: footer}"></div>

    <div th:insert="~{index :: bootstrapScript}"></div>

</body>
</html>
